<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Самооценка и картинки</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one working sheet in the centre; the scale is the hero, instructions sit beside it, psychologist's tools fold below */
:root{
  --bg:#f4f5f8; --sheet:#ffffff; --fg:#1b2130; --muted:#5d6577; --line:#d9dce5; --graphite:#2a3040;
  --ink:#2f4fd8; --ink-soft:#e7ebfd; --ok:#1f8a5b; --warn:#b85a12; --warn-soft:#fbeee2; --band:#eef0f5;
  --f-display:"Onest","Golos Text",system-ui,sans-serif; --f-body:"Golos Text",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11141b; --sheet:#181c25; --fg:#e7eaf1; --muted:#9aa2b4; --line:#2e3442; --graphite:#c9cfdc;
  --ink:#8fa3ff; --ink-soft:#232b4d; --ok:#5fd09c; --warn:#f0a35f; --warn-soft:#3a2a1c; --band:#1e2330; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141b; --sheet:#181c25; --fg:#e7eaf1; --muted:#9aa2b4; --line:#2e3442; --graphite:#c9cfdc;
  --ink:#8fa3ff; --ink-soft:#232b4d; --ok:#5fd09c; --warn:#f0a35f; --warn-soft:#3a2a1c; --band:#1e2330; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.7rem;font-weight:700}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.eyebrow{font:600 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=date],textarea,select{font:inherit;color:var(--fg);background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,svg:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button{font:500 .95rem var(--f-body);cursor:pointer;border-radius:6px;padding:8px 14px;border:1px solid var(--line);background:var(--sheet);color:var(--fg)}
button:hover{border-color:var(--graphite)}
button.primary{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
button.primary:disabled{opacity:.4;cursor:default}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 8px}
button.chip{border-radius:999px;padding:5px 12px;font-size:.85rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
/* scale editor */
.scales{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:28px 1.1fr 1.6fr 1.6fr 150px auto;gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:8px}
.srow .n{font:600 .85rem var(--f-mono);color:var(--muted);padding-bottom:9px}
.srow .tools{display:flex;gap:2px}
@media (max-width:760px){.srow{grid-template-columns:1fr 1fr}.srow .n{grid-column:1/-1;padding:0}.srow .wide{grid-column:1/-1}}
/* run */
.run{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.run{grid-template-columns:1fr}}
.scalebox{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.pole{font:500 .95rem var(--f-body);max-width:28ch}
.pole small{display:block;font:600 .68rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#mark{width:100%;height:auto;touch-action:none;cursor:crosshair;display:block;min-width:0}
.scalerow{display:grid;grid-template-columns:minmax(70px,210px) minmax(0,1fr) minmax(70px,210px);gap:14px;align-items:center}
.scalerow .pole{font-size:1rem;line-height:1.3;max-width:none}
.scalerow .l{text-align:right}
.scalerow .r{text-align:left}
@media (max-width:560px){.scalerow{gap:6px}.scalerow .pole{font-size:.78rem}}
.miss{min-height:1.4em;text-align:center;color:var(--warn);font-size:.95rem}
.runsheet{gap:22px;padding:24px}
.poles{display:flex;justify-content:space-between;gap:24px;margin-top:-8px}
.poles .pole{max-width:40%;font-size:1rem}
.poles .r{text-align:right}
button.big{padding:12px 34px;font-size:1.05rem}
.runsheet .instr{font-size:clamp(1.1rem,2.2vw,1.4rem);max-width:44ch;margin:0;min-height:4.4em;display:flex;align-items:center}
.instrrow{display:flex;gap:20px;align-items:center;justify-content:center}
.ex{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border:1px dashed var(--line);border-radius:8px}
.ex svg{width:77px;height:63px;display:block}
.ex span{font:600 .66rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
@media (max-width:560px){.instrrow{gap:12px}.ex svg{width:56px;height:46px}}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;color:var(--muted)}
.step svg{flex:none}
.step.now{border-color:var(--ink);background:var(--ink-soft);color:var(--fg)}
.step.done{color:var(--fg)}
.instr{font:500 1.15rem/1.45 var(--f-display)}
details.psy{border:1px dashed var(--line);border-radius:8px;padding:10px 12px}
details.psy summary{cursor:pointer;font-weight:600;color:var(--muted)}
details.psy[open]{display:flex;flex-direction:column;gap:10px}
details.psy[open] > *:not(summary){margin-top:10px}
.hint{background:var(--warn-soft);border-radius:6px;padding:8px 10px;font-size:.9rem}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--ink)}
/* results */
.profile{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--sheet)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px}
.card b{font:700 1.05rem var(--f-display)}
.find{display:flex;flex-direction:column;gap:10px}
.fi{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--line)}
.fi.comp{border-color:var(--warn);background:var(--warn-soft)}
.tag{font:600 .7rem var(--f-mono);padding:3px 7px;border-radius:4px;background:var(--band);color:var(--muted);height:fit-content;white-space:nowrap}
.fi.comp .tag{background:var(--warn);color:var(--sheet)}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.note{font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.mk{transition:transform .08s}}
/* home */
.methods{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.method{gap:12px}
.status{font:600 .72rem var(--f-mono);letter-spacing:.04em;padding:4px 9px;border-radius:999px;background:var(--band);color:var(--muted);white-space:nowrap}
.status.ok{background:var(--ok);color:var(--sheet)}
.status.mid{background:var(--ink-soft);color:var(--ink)}
.mthumbs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mthumbs img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:4px}
/* pictures settings */
.gpicks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.gpick{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:8px;padding:8px}
.gpick.off{opacity:.45}
.gthumb{position:relative;display:block;cursor:pointer;background:#fff;border-radius:4px;overflow:hidden;aspect-ratio:4/3}
.gthumb img{width:100%;height:100%;object-fit:contain;display:block}
.gthumb input{position:absolute;top:6px;left:6px;width:18px;height:18px;accent-color:var(--ink)}
/* board: one screen, no scroll */
body.board{overflow:hidden;padding-block:8px}
#app.boardwrap{max-width:none;height:calc(100dvh - 16px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));gap:8px}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.gtabs{display:flex;gap:4px;overflow-x:auto;min-width:0;padding:2px}
.gtab{white-space:nowrap;border-radius:999px;padding:6px 14px}
.gtab.on{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.gtab i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-left:7px;vertical-align:middle}
.gboard{flex:1;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px}
.gtools{display:flex;flex-direction:column;gap:10px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:8px;overflow-y:auto;min-height:0}
.tgroup{display:flex;flex-direction:column;gap:2px}
.tgroup.sw{display:grid;grid-template-columns:repeat(3,30px);gap:6px;justify-content:center}
.tgroup.sizes{flex-direction:row;justify-content:center;gap:4px}
.tool{display:flex;align-items:center;gap:8px;padding:5px 10px;border-color:transparent;background:transparent;font-size:.88rem;text-align:left}
.tool.on{background:var(--ink-soft);border-color:var(--ink);color:var(--fg)}
.swatch{width:30px;height:30px;padding:0;border-radius:50%;background:var(--c);border:2px solid var(--sheet);box-shadow:0 0 0 1px var(--line)}
.swatch.on{box-shadow:0 0 0 2.5px var(--ink)}
.size{display:flex;align-items:center;justify-content:center;width:42px;height:42px;padding:0;border-color:transparent;background:transparent}
.size i{display:block;border-radius:50%}
.size.on{background:var(--ink-soft);border-color:var(--ink)}
.gstage{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gpic{position:relative;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;flex:none}
.gpic img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.gpic canvas{position:absolute;inset:0;mix-blend-mode:multiply}
#glive{cursor:none}
.gpic[data-tool="fill"] #glive{cursor:crosshair}
#gcur{position:absolute;left:0;top:0;border-radius:50%;pointer-events:none;border:1px solid rgba(0,0,0,.75);box-shadow:0 0 0 1px rgba(255,255,255,.9)}
.gside{position:absolute;top:0;right:0;bottom:0;width:min(360px,92%);background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:5}
.gside textarea{flex:1;min-height:120px}
@media (max-width:760px){.gboard{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.gtools{flex-direction:row;overflow-x:auto;overflow-y:hidden}.tgroup{flex-direction:row}.tgroup.sw{display:flex}.tool span{display:none}.gtop{flex-wrap:wrap}}

/* screening: shared */
.mthumbs.tall{grid-template-columns:repeat(4,minmax(0,1fr))}
.mthumbs.tall img{aspect-ratio:3/4}
.qthumb{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;border:2px dashed var(--ink);border-radius:4px;color:var(--ink);font:700 1.2rem var(--f-display)}
.sotop{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.sprog{display:flex;flex-direction:column;gap:6px;min-width:0}
.shint{text-align:center;color:var(--muted);font:500 1rem var(--f-display);margin:0}
.shint.nudge{animation:nudge .5s}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* social */
.sostage{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:12px;--s:160px}
.stimrow{display:grid;grid-template-columns:repeat(var(--cols,5),var(--s));gap:12px;justify-content:center}
.sframe{position:relative;width:var(--s);height:var(--s);background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sframe img{width:100%;height:100%;object-fit:contain;display:block}
.sframe .badge{position:absolute;left:6px;top:6px;font:600 .72rem var(--f-mono);background:var(--graphite);color:var(--sheet);border-radius:4px;padding:1px 6px;pointer-events:none}
.sframe.gap{border:2.5px dashed var(--ink);background:var(--ink-soft);display:flex;align-items:center;justify-content:center;transition:transform .12s,box-shadow .12s}
.sframe.gap .qmark{font:700 calc(var(--s) * .35) var(--f-display);color:var(--ink)}
.sframe.gap.filled{border-style:solid;background:#fff}
.sframe.gap.filled .qmark{display:none}
.sframe.gap.hot{transform:scale(1.04);box-shadow:0 0 0 5px var(--ink-soft)}
.sframe.gap .scard{position:absolute;inset:0;width:auto;height:auto;border:0;border-radius:0}
.ansrow{display:grid;grid-template-columns:repeat(4,var(--s));gap:12px;justify-content:center;padding-top:12px;border-top:1px dashed var(--line)}
.sslot{width:var(--s);height:var(--s);border-radius:8px;background:var(--band);border:1.5px dashed var(--line)}
.scard{width:100%;height:100%;background:#fff;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.scard:hover{border-color:var(--ink)}
.scard:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.scard img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.scard.lifted{opacity:.25}
.sdragging{position:fixed;left:0;top:0;z-index:100;pointer-events:none;background:#fff;border:2px solid var(--ink);border-radius:8px;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.25)}
.sdragging img{width:100%;height:100%;object-fit:contain;display:block}
@media (max-width:760px){.ansrow{grid-template-columns:repeat(4,minmax(0,var(--s)))}.sslot{width:auto;aspect-ratio:1;height:auto}}
/* emotional */
.pstage{flex:1;min-height:0;position:relative}
.pairs-board{position:relative;width:100%;border:1px solid var(--line);border-radius:10px;background-color:#fbfcfd;background-image:linear-gradient(rgba(38,40,44,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(38,40,44,.045) 1px,transparent 1px);background-size:32px 32px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;transition:height .35s ease}
.fig{position:absolute;left:0;top:0;z-index:2;cursor:grab;touch-action:none;transition:left .42s cubic-bezier(.25,1.2,.4,1),top .42s cubic-bezier(.25,1.2,.4,1),width .3s,height .3s,filter .15s,transform .15s;outline:none}
.fig img{width:100%;height:100%;object-fit:contain;object-position:center bottom;display:block;pointer-events:none}
.fig:hover,.fig:focus-visible{filter:drop-shadow(0 0 3px rgba(47,79,216,.8))}
.fig.selected{filter:drop-shadow(0 0 4px #2f4fd8);transform:translateY(-6px)}
.fig.dragging{transition:filter .15s,transform .15s;z-index:50;cursor:grabbing;transform:scale(1.04);filter:drop-shadow(0 10px 14px rgba(38,40,44,.25))}
.fig.target{filter:drop-shadow(0 0 5px #1f8a5b) drop-shadow(0 0 2px #1f8a5b)}
.pair-frame{position:absolute;z-index:1;border:2.5px solid #3a3d42;border-radius:16px;background:rgba(255,255,255,.88);box-shadow:0 4px 14px rgba(38,40,44,.08);transition:left .42s cubic-bezier(.25,1.2,.4,1),top .42s cubic-bezier(.25,1.2,.4,1),width .3s,height .3s;pointer-events:none}
.pair-frame.ghost{border:2.5px dashed #1f8a5b;background:rgba(31,138,91,.05);box-shadow:none;transition:none}
.pair-tools{position:absolute;z-index:5;display:flex;gap:4px;padding:3px;border-radius:999px;background:#fff;transition:left .42s cubic-bezier(.25,1.2,.4,1),top .42s cubic-bezier(.25,1.2,.4,1)}
.pair-tools button{width:30px;height:30px;border-radius:50%;border:1.5px solid #c9d3d7;background:#fff;color:#444;font-size:15px;font-weight:700;line-height:1;padding:0;display:flex;align-items:center;justify-content:center}
.pairs-board.no-anim .fig,.pairs-board.no-anim .pair-frame,.pairs-board.no-anim .pair-tools,.pairs-board.no-anim{transition:none!important}
@media (prefers-reduced-motion:reduce){.fig,.pair-frame,.pair-tools,.pairs-board{transition:none!important}}
.tfig{height:56px;width:auto;display:block}
.tcard{height:64px;width:64px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:4px;display:block}
/* results */
.gres{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px}
.gshot{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.gshot canvas{display:block;width:100%;height:auto}
.gnote{white-space:pre-wrap}

</style>
</head>
<body>


<div class="wrap" id="app"></div>

<script>
const KEY='dembo-rub-v1';
const I6=100/6;
const DEFAULTS=[
 {name:'Здоровье',top:'самый здоровый человек на свете',bottom:'самый больной человек на свете'},
 {name:'Ум',top:'самый умный человек на свете',bottom:'самый глупый человек на свете'},
 {name:'Характер',top:'человек с самым лучшим характером',bottom:'человек с самым плохим характером'},
 {name:'Счастье',top:'самый счастливый человек на свете',bottom:'самый несчастный человек на свете'},
 {name:'Удовлетворённость собой',top:'человек, полностью довольный собой',bottom:'человек, совсем недовольный собой',role:'sat'},
 {name:'Оптимизм',top:'самый большой оптимист — всегда ждёт хорошего',bottom:'самый большой пессимист — всегда ждёт плохого',role:'opt'}
];
const EXTRA=[
 {name:'Уверенность в себе',top:'самый уверенный в себе человек',bottom:'самый неуверенный в себе человек'},
 {name:'Доброта',top:'самый добрый человек на свете',bottom:'самый злой человек на свете'},
 {name:'Умение ладить с людьми',top:'лучше всех ладит с людьми',bottom:'совсем не умеет ладить с людьми'},
 {name:'Авторитет у сверстников',top:'самый уважаемый среди сверстников',bottom:'совсем неуважаемый среди сверстников'},
 {name:'Внешность',top:'самый красивый человек на свете',bottom:'самый некрасивый человек на свете'},
 {name:'Умелые руки',top:'человек с самыми умелыми руками',bottom:'человек с самыми неумелыми руками'}
];
let uid=0;const mkScale=s=>({id:'s'+Date.now().toString(36)+(uid++),name:s.name||'',top:s.top||'',bottom:s.bottom||'',role:s.role||'',note:'',m:{},st:{}});
function fresh(){return{phase:'setup',name:'',age:'',date:new Date().toISOString().slice(0,10),addr:'ty',others:false,scales:DEFAULTS.map(mkScale),idx:0,step:0,pass:'main',done:false,sid:''}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.scales)S=fresh();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=q=>document.querySelector(q);
const ty=()=>S.addr==='ty';

/* ---------- glyphs ---------- */
const G={
 a:(x,y,k=1,c='var(--graphite)',h)=>h?`<line class="mk" x1="${x}" y1="${y-34*k}" x2="${x}" y2="${y+34*k}" stroke="${c}" stroke-width="${5*k}" stroke-linecap="round"/>`:`<line class="mk" x1="${x-34*k}" y1="${y}" x2="${x+34*k}" y2="${y}" stroke="${c}" stroke-width="${5*k}" stroke-linecap="round"/>`,
 i:(x,y,k=1,c='var(--ink)',h)=>{const a=7*k,q=8.5*k;return h?`<path class="mk" d="M${x},${y-34*k} q${-a*1.7},${q} 0,${2*q} t0,${2*q} t0,${2*q} t0,${2*q}" fill="none" stroke="${c}" stroke-width="${3.5*k}" stroke-linecap="round"/>`:`<path class="mk" d="M${x-34*k},${y} q${q},${-a*1.7} ${2*q},0 t${2*q},0 t${2*q},0 t${2*q},0" fill="none" stroke="${c}" stroke-width="${3.5*k}" stroke-linecap="round"/>`},
 p:(x,y,k=1,c='var(--ok)')=>`<path class="mk" d="M${x-13*k},${y-17*k} L${x},${y} L${x+13*k},${y-17*k}" fill="none" stroke="${c}" stroke-width="${3.5*k}" stroke-linecap="round" stroke-linejoin="round"/>`,
 o:(x,y,k=1,c='var(--warn)')=>`<path class="mk" d="M${x-10*k},${y-10*k} L${x+10*k},${y+10*k} M${x+10*k},${y-10*k} L${x-10*k},${y+10*k}" stroke="${c}" stroke-width="${3.5*k}" stroke-linecap="round"/>`
};
const icon=(k)=>`<svg width="34" height="34" viewBox="0 0 80 80" aria-hidden="true"><line x1="40" y1="6" x2="40" y2="74" stroke="var(--line)" stroke-width="3"/>${G[k](40,k==='p'?50:40,1.2)}</svg>`;
const MARK={a:'Чёрточка',i:'Волнистая линия',p:'Галочка',o:'Крестик'};
const MEAN={a:'актуальная самооценка',i:'идеальная самооценка («уровень мечты»)',p:'оценка своих возможностей',o:'как оценивают другие'};
function instr(k,s){
 const t=ty();
 return{
  a:t?'Отметь чёрточкой, где ты находишься сейчас — как ты сам это чувствуешь.':'Перечеркните шкалу в том месте, где вы сейчас находитесь — как вы сами это понимаете или чувствуете.',
  i:t?'Теперь отметь волнистой линией место, где ты хотел бы оказаться, — о чём мечтаешь.':'Теперь отметьте волнистой линией место, где вы мечтали бы оказаться.',
  p:t?'А теперь галочкой — то, чего ты реально сможешь достичь, если честно оценить свои возможности.':'Галочкой отметьте то, чего вы реально сможете достичь, объективно оценивая свои возможности.',
  o:t?'Отметь крестиком: каким тебя считают другие люди?':'Отметьте крестиком: каким (какой) вас считают другие?'
 }[k];
}

/* ---------- analysis ---------- */
const zone=v=>{if(Math.abs(v-50)<2)return 0;return v>50?Math.min(3,Math.ceil((v-50)/I6)):-Math.min(3,Math.ceil((50-v)/I6))};
const ZN={3:'чрезмерно высокая',2:'повышенная',1:'нормальная',0:'на середине шкалы','-1':'пониженная','-2':'выраженно пониженная','-3':'крайне низкая'};
const mean=a=>a.reduce((x,y)=>x+y,0)/(a.length||1);
const sd=a=>{const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))};
const median=a=>{const b=[...a].sort((x,y)=>x-y),n=b.length;return n?(n%2?b[(n-1)/2]:(b[n/2-1]+b[n/2])/2):0};
const lvl=(v)=>v>=66.7?2:v>=48?1:0;
const LV=['низкая','средняя','высокая'];

function analyze(scales=S.scales){
 const all=scales.filter(s=>s.m.a!=null&&s.m.i!=null&&s.m.p!=null);
 let core=all.filter(s=>!s.role); if(core.length<2)core=all;
 const A=core.map(s=>s.m.a),Iv=core.map(s=>s.m.i),P=core.map(s=>s.m.p);
 const gaps=core.map(s=>Math.max(0,s.m.i-s.m.a));
 const R={n:all.length,core,findings:[],points:0};
 if(!core.length)return R;
 const mA=mean(A),mI=mean(Iv),mG=mean(gaps);
 R.height={v:mA,z:zone(mA)};
 const range=(Math.max(...A)-Math.min(...A))/I6;
 R.stab={range,label:range<=1.5?'устойчивая (равномерная)':range<3?'относительно неравномерная':'выраженно неравномерная'};
 // satisfaction (indirect)
 const gI=mG/I6; const satInd=gI<1?2:gI<=2?1:0; R.sat={gap:gI,ind:satInd};
 // optimism (indirect): share of reachable part of the gap
 const shares=core.filter(s=>s.m.i-s.m.a>1).map(s=>Math.max(0,Math.min(1,(s.m.p-s.m.a)/(s.m.i-s.m.a))));
 const sh=shares.length?mean(shares):null; const optInd=sh==null?null:sh>=.6?2:sh>=.35?1:0; R.opt={share:sh,ind:optInd};
 const satS=all.find(s=>s.role==='sat'),optS=all.find(s=>s.role==='opt');
 if(satS)R.sat.dir=lvl(satS.m.a); if(optS&&optInd!=null)R.opt.dir=lvl(optS.m.a);
 const F=(title,text,comp)=>{R.findings.push({title,text,comp});if(comp)R.points++};
 const names=a=>a.map(s=>'«'+s.name+'»').join(', ');

 // dips & peaks
 const dips=[],peaks=[];
 if(core.length>=3)core.forEach(s=>{const others=core.filter(o=>o!==s).map(o=>o.m.a);const d=(s.m.a-median(others))/I6;if(d<=-1)dips.push(s);if(d>=1&&zone(s.m.a)===3)peaks.push(s)});
 if(dips.length)F('Западение самооценки',`Отметка заметно ниже, чем по остальным шкалам: ${names(dips)}. Возможная проблемная зона — её стоит обсудить с испытуемым.`,false);
 // 1 partial compensation
 if(peaks.length&&dips.length)F('1. Частичная компенсаторная потеря критичности',`Пик в верхнем интервале (${names(peaks)}) на фоне западения (${names(dips)}). Похоже на «идеализацию»: чрезмерно высокая оценка по одной шкале прикрывает проблему по другой. Проверка: сомнение в пике часто вызывает защитную реакцию.`,true);
 // 2/3 compensatory lowering of ideal
 const sdG=sd(gaps)/I6;
 if(mA<50&&mI<83.3&&sdG<.6)F('2. Механизм борьбы с депрессией',`Идеальная самооценка снижена (в среднем ${mI.toFixed(0)}) и идёт «лентой» параллельно пониженной актуальной. Испытуемый снижает уровень мечты, чтобы чувствовать себя довольнее тем, что есть.`,true);
 if(mA>=66.7&&gI<.9&&mI<97)F('3. Общее компенсаторное повышение удовлетворённости собой',`При повышенной актуальной самооценке волнистые линии (идеал) слишком близко к чёрточкам (средний разрыв ${gI.toFixed(1)} интервала). Гипотетически — вытесняемая неудовлетворённость собой.`,true);
 // 4 disintegration direct/indirect
 const mism=[];
 if(R.sat.dir!=null&&Math.abs(R.sat.dir-satInd)===2)mism.push(`удовлетворённость собой: прямо — ${LV[R.sat.dir]}, косвенно — ${LV[satInd]}`);
 if(R.opt.dir!=null&&optInd!=null&&Math.abs(R.opt.dir-optInd)===2)mism.push(`оптимизм: прямо — ${LV[R.opt.dir]}, косвенно — ${LV[optInd]}`);
 if(mism.length)F('4. Дезинтеграция осознанного и неосознанного уровней',`Прямая и косвенная оценки резко расходятся (${mism.join('; ')}). Возможные причины: неискренность, низкий уровень рефлексии или компенсация.`,true);
 // 5 inflation of dream
 const infl=core.filter(s=>s.m.p>=s.m.i-3&&s.m.i<90),over=core.filter(s=>s.m.p>=s.m.i-3&&s.m.i>=90);
 if(infl.length>=Math.max(2,core.length/2))F('5. Инфляция мечты',`Галочки совпадают с волнистыми линиями (идеалом) или выше них, а идеал опущен (${names(infl)}). Уровень мечты смещён на уровень возможностей. Стоит выяснить, различает ли испытуемый мечту и цель.`,true);
 if(over.length>=Math.max(2,core.length/2))F('Переоценка своих возможностей',`Галочки и волнистые линии совпадают в самом верхнем диапазоне: ${names(over)}.`,false);
 // 6 inadequately high
 const top=core.filter(s=>zone(s.m.a)===3);
 if(mA>=83.3||top.length>=Math.max(2,core.length/2))F('6. Неадекватно завышенная самооценка',`Большинство чёрточек в верхнем интервале (${names(top)}). Возможно снижение критичности; проверьте уточняющими вопросами («правильно ли я понял, что вас можно отнести к 5% людей…»).`,true);
 // notes
 const mid=all.filter(s=>zone(s.m.a)===0);
 if(mid.length>=2)F('Отметки на середине',`Чёрточка на середине: ${names(mid)}. Это может значить снижение самооценки или формальное отношение — середина служит «домиком».`,false);
 const pole=all.filter(s=>s.m.i>=96);
 if(pole.length>3)F('Идеал на полюсах',`Волнистая линия на полюсе по ${pole.length} шкалам (${names(pole)}). Возможный признак незрелого отношения к ценностям («самый-самый»).`,false);
 const pLow=all.filter(s=>s.m.p<s.m.a-2);
 if(pLow.length)F('Галочка ниже чёрточки',`${names(pLow)}: испытуемый оценивает свои возможности ниже нынешнего положения — стоит уточнить, что он имел в виду.`,false);
 const iLow=all.filter(s=>s.m.i<s.m.a-2);
 if(iLow.length)F('Идеал ниже чёрточки',`${names(iLow)}: идеал ниже актуальной отметки. Возможно, шкала «перевёрнута» для испытуемого — уточните, какой полюс для него желательный.`,false);
 const oth=all.filter(s=>s.m.o!=null&&Math.abs(s.m.o-s.m.a)>=I6);
 if(oth.length)F('Как оценивают другие',oth.map(s=>`«${s.name}»: другие, по его мнению, оценивают ${s.m.o>s.m.a?'выше':'ниже'}`).join('; ')+'.',false);
 R.mA=mA;R.mI=mI;R.mP=mean(P);
 return R;
}

function stepsFor(){return S.pass==='others'?['o']:['a','i','p']}

function vRun(){
 const s=S.scales[S.idx],steps=stepsFor(),k=steps[S.step],cur=s.m[k];
 const total=S.scales.length;
 $('#app').innerHTML=`
 <div class="progress" aria-label="Шкала ${S.idx+1} из ${total}">${S.scales.map((_,j)=>`<i class="${j<=S.idx?'on':''}"></i>`).join('')}</div>
 <div class="row" style="justify-content:space-between"><div><div class="eyebrow">${S.pass==='others'?'Дополнительный проход · ':''}Шкала ${S.idx+1} из ${total}</div><h1>${esc(s.name)}</h1></div></div>
 <section class="sheet runsheet">
  <div class="instrrow"><div class="ex" aria-hidden="true"><svg viewBox="0 0 120 100">${exampleMark(k)}</svg><span>вот так</span></div><p class="instr">${esc(instr(k,s))}</p></div>
  <div class="scalerow"><div class="pole l">${esc(s.bottom)}</div>
  <svg id="mark" viewBox="0 0 1000 520" tabindex="0" role="slider" aria-label="${MARK[k]} на шкале ${esc(s.name)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${cur==null?'':Math.round(cur)}"></svg>
  <div class="pole r">${esc(s.top)}</div></div>
  <p class="miss" id="miss"></p>
  <div class="row" style="justify-content:space-between"><button id="undo" class="ghost">Стереть отметку</button><button id="next" class="primary big" ${cur==null?'disabled':''}>Далее</button></div>
 </section>
 <details class="psy"><summary>Для психолога</summary>
  <div id="hints" style="display:flex;flex-direction:column;gap:8px"></div>
  <label class="f">Протокол беседы по шкале<textarea id="note" placeholder="Как испытуемый описывает полюса, реплики, реакции…">${esc(s.note)}</textarea></label>
  <div style="display:flex;flex-direction:column;gap:6px"><b style="font-size:.9rem">Новая шкала из беседы</b><p class="note">Встанет сразу после этой. Например, качества, которые испытуемый назвал, описывая полюс.</p>
   <input id="nsN" type="text" placeholder="Название"><input id="nsT" type="text" placeholder="Верхний (желательный) полюс"><input id="nsB" type="text" placeholder="Нижний полюс">
   <div><button id="nsAdd">Добавить шкалу</button></div></div>
  <div><button class="ghost" id="toSetup">Выйти на главную (ответы сохранятся)</button></div>
 </details>
 </div>`;
 drawMark();hints();
 $('#note').oninput=e=>{s.note=e.target.value;save()};
 $('#next').onclick=()=>{
  if(s.m[k]==null)return;
  if(S.step<steps.length-1){S.step++;return render()}
  S.step=0;
  if(S.idx<total-1){S.idx++;return render()}
  if(S.pass==='main'&&S.others){S.pass='others';S.idx=0;return render()}
  S.idx=total;S.done=true;S.phase='setup';upsertSession();goHome();
 };
 $('#undo').onclick=()=>{const st=s.st||(s.st={});if(s.m[k]!=null){delete s.m[k];delete st[k]}else if(S.step>0){S.step--;delete s.m[steps[S.step]];delete st[steps[S.step]]}render()};
 $('#nsAdd').onclick=()=>{const n=$('#nsN').value.trim();if(!n)return;S.scales.splice(S.idx+1,0,mkScale({name:n,top:$('#nsT').value,bottom:$('#nsB').value}));render()};
 $('#toSetup').onclick=()=>{upsertSession();goHome()};
}

function exampleMark(k){
 const ly=50,c='var(--muted)',ink='var(--ink)';
 let h=`<line x1="8" y1="${ly}" x2="112" y2="${ly}" stroke="${c}" stroke-width="2.5"/><line x1="8" y1="${ly-9}" x2="8" y2="${ly+9}" stroke="${c}" stroke-width="2.5"/><line x1="112" y1="${ly-9}" x2="112" y2="${ly+9}" stroke="${c}" stroke-width="2.5"/>`;
 if(k==='p')h+=`<path d="M44,16 Q54,28 55,${ly} Q70,30 94,24" fill="none" stroke="${ink}" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>`;
 else h+=G[k](66,ly,k==='o'?1.6:1.15,ink,true);
 return h;
}
const X0=14,XL=972,XV=v=>X0+v*XL/100,LY=260;
const pathOf=pts=>pts.length?'M'+pts.map(p=>p.join(',')).join(' L'):'';
function drawMark(live){
 const s=S.scales[S.idx],steps=stepsFor(),k=steps[S.step],svg=$('#mark'),st=s.st||{};
 const c='var(--graphite)';
 let h=`<rect x="0" y="0" width="1000" height="520" fill="transparent"/>
 <line x1="${X0}" y1="${LY}" x2="${X0+XL}" y2="${LY}" stroke="${c}" stroke-width="3"/>
 <line x1="${X0}" y1="${LY-30}" x2="${X0}" y2="${LY+30}" stroke="${c}" stroke-width="3"/>
 <line x1="${X0+XL}" y1="${LY-30}" x2="${X0+XL}" y2="${LY+30}" stroke="${c}" stroke-width="3"/>
 <line x1="${XV(50)}" y1="${LY-18}" x2="${XV(50)}" y2="${LY+18}" stroke="${c}" stroke-width="3"/>`;
 const show=S.pass==='others'?['a','i','p','o']:['a','i','p'];
 show.forEach(q=>{
  if(live&&q===k)return;
  const v=s.m[q];if(v==null)return;
  const faded=S.pass==='others'&&q!=='o',col=q===k?'var(--ink)':'var(--graphite)';
  h+=`<g opacity="${faded?.3:1}">`+(st[q]?`<path d="${pathOf(st[q])}" fill="none" stroke="${col}" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>`:G[q](XV(v),LY,1.25,col,true))+'</g>';
 });
 if(live)h+=`<path d="${pathOf(live)}" fill="none" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>`;
 svg.innerHTML=h;
 svg.setAttribute('aria-valuenow',s.m[k]==null?'':Math.round(s.m[k]));
 const nb=$('#next');if(nb)nb.disabled=s.m[k]==null;
}
/* where the drawn stroke meets the scale line */
function crossing(pts){
 const xs=[];
 for(let i=1;i<pts.length;i++){const[x1,y1]=pts[i-1],[x2,y2]=pts[i];const d1=y1-LY,d2=y2-LY;
  if(d1===0&&d2===0){xs.push(x1,x2);continue}
  if(d1*d2<=0&&d1!==d2)xs.push(x1+(x2-x1)*d1/(d1-d2));}
 if(pts.length===1||(!xs.length)){let best=null;pts.forEach(([x,y])=>{const d=Math.abs(y-LY);if(d<=50&&(!best||d<best.d))best={d,x}});if(best)xs.push(best.x)}
 if(!xs.length)return null;
 return xs.reduce((a,b)=>a+b,0)/xs.length;
}
function setVal(v){const s=S.scales[S.idx],k=stepsFor()[S.step];s.m[k]=Math.round(Math.max(0,Math.min(100,v))*10)/10;drawMark();hints();save()}
function hints(){
 const box=$('#hints');if(!box)return;const s=S.scales[S.idx],m=s.m,H=[];
 const fmt=v=>v==null?'—':Math.round(v);H.push(`Отметки (0–100): чёрточка ${fmt(m.a)} · волна ${fmt(m.i)} · галочка ${fmt(m.p)}${m.o!=null?' · крестик '+fmt(m.o):''}`);
 H.push(`Уточните содержание полюсов: что делает человека «${esc(s.top)}» таким? А «${esc(s.bottom)}»? Насколько тема значима для испытуемого?`);
 if(m.a!=null&&m.a>=88)H.push(`Чёрточка у желательного полюса. Можно мягко проверить: «Правильно ли я понял${ty()?'':'(а)'}, что ${ty()?'тебя':'вас'} можно отнести к 5% людей — ${esc(s.top)}?»`);
 if(m.a!=null&&m.a<=35)H.push('Низкая отметка: возможная проблемная зона. Расспросите, что мешает подняться выше. Не разубеждайте.');
 if(m.a!=null&&Math.abs(m.a-50)<2)H.push('Чёрточка на середине: уточните, что она значит — снижение или нежелание раскрываться.');
 if(m.i!=null&&m.i>=96)H.push('Волнистая линия на самом полюсе («самый-самый»).');
 if(m.i!=null&&m.a!=null&&m.i<m.a-2)H.push('Волнистая линия ниже чёрточки: возможно, для испытуемого желательный полюс — другой.');
 if(m.p!=null&&m.i!=null&&m.p>=m.i-3)H.push('Галочка совпадает с волнистой линией. Спросите, чем мечта отличается от цели.');
 if(m.p!=null&&m.a!=null&&m.p<m.a-2)H.push('Галочка ниже чёрточки: испытуемый не видит возможностей роста — уточните.');
 box.innerHTML=H.map(t=>`<div class="hint">${t}</div>`).join('');
}
document.addEventListener('pointerdown',e=>{
 const svg=e.target.closest&&e.target.closest('#mark');if(!svg)return;

 });
 const path=(key)=>{const pts=L.map((s,j)=>s.m[key]==null?null:[x(j),y(s.m[key])]).filter(Boolean);if(pts.length<2)return'';let d=`M${pts[0]}`;for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;d+=` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2}`}return d};

/* ---- fill masks ---- */
const fillCache=new WeakMap(),maskCache=new WeakMap();
function rleEncode(m){const out=[];let cur=0,run=0;for(let i=0;i<m.length;i++){if(m[i]===cur)run++;else{out.push(run.toString(36));cur=m[i];run=1}}out.push(run.toString(36));return out.join('.')}

 if(fillCache.has(s))return fillCache.get(s);
 const m=decodeMask(s),c=document.createElement('canvas');c.width=s.mw;c.height=s.mh;const x=c.getContext('2d'),id=x.createImageData(s.mw,s.mh);
 const r=parseInt(s.color.slice(1,3),16),g=parseInt(s.color.slice(3,5),16),b=parseInt(s.color.slice(5,7),16);
 for(let i=0;i<m.length;i++)if(m[i]){const o=i*4;id.data[o]=r;id.data[o+1]=g;id.data[o+2]=b;id.data[o+3]=255}
 x.putImageData(id,0,0);fillCache.set(s,c);return c;
}
const lumCache={};
async function picWalls(id){
 if(lumCache[id])return lumCache[id];const p=PIC[id],img=await loadImg(p.src),mh=Math.round(MW*p.h/p.w);
 const c=document.createElement('canvas');c.width=MW;c.height=mh;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,MW,mh);x.drawImage(img,0,0,MW,mh);

 return lumCache[id]={w,mh};
}
async function floodFill(id,strokes,fx,fy,color){
 const {w:pw,mh}=await picWalls(id);
 const c=document.createElement('canvas');c.width=MW;c.height=mh;const x=c.getContext('2d');
 strokes.forEach(s=>{if(s.del==null&&(s.tool==='pen'||s.tool==='felt'))drawStroke(x,s,MW,mh)});
 const sd=x.getImageData(0,0,MW,mh).data,wall=new Uint8Array(MW*mh);
 for(let i=0;i<wall.length;i++)wall[i]=pw[i]||sd[i*4+3]>110?1:0;
 let sx=Math.min(MW-1,Math.max(0,Math.round(fx*MW))),sy=Math.min(mh-1,Math.max(0,Math.round(fy*mh)));
 if(wall[sy*MW+sx]){let best=null;for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const X=sx+dx,Y=sy+dy;if(X>=0&&Y>=0&&X<MW&&Y<mh&&!wall[Y*MW+X]){const d=dx*dx+dy*dy;if(!best||d<best.d)best={d,X,Y}}}if(!best)return null;sx=best.X;sy=best.Y}
 const m=new Uint8Array(MW*mh),st=[sx,sy];
 while(st.length){const yy=st.pop(),xx=st.pop();let l=xx;const row=yy*MW;if(m[row+xx]||wall[row+xx])continue;
  while(l>0&&!wall[row+l-1]&&!m[row+l-1])l--;let r=xx;while(r<MW-1&&!wall[row+r+1]&&!m[row+r+1])r++;
  for(let i=l;i<=r;i++){m[row+i]=1;if(yy>0){const k=row-MW+i;if(!m[k]&&!wall[k])st.push(i,yy-1)}if(yy<mh-1){const k=row+MW+i;if(!m[k]&&!wall[k])st.push(i,yy+1)}}}
 const d=m.slice();for(let yy=0;yy<mh;yy++)for(let xx=0;xx<MW;xx++){const i=yy*MW+xx;if(m[i])continue;if((xx>0&&m[i-1])||(xx<MW-1&&m[i+1])||(yy>0&&m[i-MW])||(yy<mh-1&&m[i+MW]))d[i]=1}

}

/* ---- stroke drawing ---- */
function strokeStyle(ctx,s,W){const T=TOOLS[s.tool];ctx.lineWidth=Math.max(1,T.w*SIZES[s.size]*W);ctx.strokeStyle=s.color;ctx.globalAlpha=T.a;ctx.lineCap='round';ctx.lineJoin='round'}
function drawStroke(ctx,s,W,H,upto){
 if(s.tool==='fill'){if(upto!=null&&s.pts[0][2]>upto)return;ctx.save();ctx.globalAlpha=.9;ctx.imageSmoothingEnabled=true;ctx.drawImage(fillCanvas(s),0,0,W,H);ctx.restore();return}
 const P=upto==null?s.pts:s.pts.filter(p=>p[2]<=upto);if(!P.length)return;
 ctx.save();strokeStyle(ctx,s,W);ctx.beginPath();
 ctx.moveTo(P[0][0]*W,P[0][1]*H);
 if(P.length===1){ctx.lineTo(P[0][0]*W+.01,P[0][1]*H)}
 for(let i=1;i<P.length-1;i++){const mx=(P[i][0]+P[i+1][0])/2*W,my=(P[i][1]+P[i+1][1])/2*H;ctx.quadraticCurveTo(P[i][0]*W,P[i][1]*H,mx,my)}
 if(P.length>1){const l=P[P.length-1];ctx.lineTo(l[0]*W,l[1]*H)}
 ctx.stroke();ctx.restore();
}
function drawAll(ctx,strokes,W,H,T){
 ctx.clearRect(0,0,W,H);
 strokes.forEach(s=>{if(T==null){if(s.del==null)drawStroke(ctx,s,W,H)}else{if(s.pts[0][2]<=T&&(s.del==null||s.del>T))drawStroke(ctx,s,W,H,T)}});
}

function fmtMs(ms){const s=Math.round(ms/1000);return Math.floor(s/60)+' мин '+String(s%60).padStart(2,'0')+' с'}
const brushPx=(tool=GS.tool,size=GS.size)=>tool==='fill'?0:TOOLS[tool].w*SIZES[size]*(gDim.W||800);

 const sizes=$g('.sizes');if(sizes)sizes.hidden=GS.tool==='fill';
 document.querySelectorAll('#app [data-size]').forEach(b=>{const k=+b.dataset.size,on=k===GS.size;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);
  const px=Math.max(3,Math.min(34,brushPx(GS.tool,k)));const i=b.querySelector('i');i.style.width=i.style.height=px+'px';
  i.style.background=GS.tool==='eraser'?'transparent':GS.color;i.style.opacity=GS.tool==='hl'?.45:1;i.style.border=GS.tool==='eraser'?'1.5px solid var(--fg)':'0'});

function toolIcon(k){

 return `<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">${{
  pen:`<path ${s} d="M4 20l1.2-4.2L16 5l3 3L8.2 18.8z"/><path ${s} d="M14 7l3 3"/>`,

  fill:`<path ${s} d="M4 12l7-7 7 7-7 7z"/><path ${s} d="M8 3l3 2"/><path fill="currentColor" d="M20 15c1 1.6 1.6 2.6 1.6 3.4a1.6 1.6 0 01-3.2 0c0-.8.6-1.8 1.6-3.4z"/>`,

let gDim={W:0,H:0,dpr:1};
function fitStage(){
 if(VIEW!=='gil'||GS.phase!=='board')return;const id=GS.list[GS.cur],p=PIC[id],st=$g('#gstage'),pic=$g('#gpic');if(!st||!pic)return;
 const maxW=st.clientWidth,maxH=st.clientHeight;if(!maxW||!maxH)return;
 let w=maxW,h=w*p.h/p.w;if(h>maxH){h=maxH;w=h*p.w/p.h}
 w=Math.floor(w);h=Math.floor(h);if(w===gDim.W&&h===gDim.H&&$g('#gbase').width)return;
 pic.style.width=w+'px';pic.style.height=h+'px';
 const dpr=Math.min(2,window.devicePixelRatio||1);gDim={W:w,H:h,dpr};
 ['#gbase','#glive'].forEach(q=>{const c=$g(q);c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';c.getContext('2d').setTransform(dpr,0,0,dpr,0,0)});
 redraw();refreshTools();
}
function redraw(){const c=$g('#gbase');if(!c)return;const d=pdata(GS.list[GS.cur]);drawAll(c.getContext('2d'),d.strokes,gDim.W,gDim.H)}
function bindDraw(d,picId){
 const live=$g('#glive'),ctx=live.getContext('2d'),cur$=$g('#gcur');let cur=null,erased=null,busy=false;
 const at=e=>{const r=live.getBoundingClientRect();return[Math.round((e.clientX-r.left)/r.width*1e4)/1e4,Math.round((e.clientY-r.top)/r.height*1e4)/1e4,now()]};
 const eraseR=()=>TOOLS.eraser.w*SIZES[GS.size]*gDim.W/2;
 const eraseAt=p=>{const W=gDim.W,H=gDim.H,R=eraseR();let hit=false;d.strokes.forEach((s,i)=>{if(s.del!=null)return;
  if(s.tool==='fill'){const m=decodeMask(s),X=Math.floor(p[0]*s.mw),Y=Math.floor(p[1]*s.mh);if(X>=0&&Y>=0&&X<s.mw&&Y<s.mh&&m[Y*s.mw+X]){s.del=p[2];erased.push(i);hit=true}return}
  const hw=TOOLS[s.tool].w*SIZES[s.size]*W/2+R;
  for(const q of s.pts){if(Math.hypot((q[0]-p[0])*W,(q[1]-p[1])*H)<=hw){s.del=p[2];erased.push(i);hit=true;break}}});if(hit)redraw()};
 const showCur=e=>{if(GS.tool==='fill'||e.pointerType==='touch'){cur$.hidden=true;return}const r=live.getBoundingClientRect();
  const dpx=GS.tool==='eraser'?eraseR()*2:brushPx();const z=Math.max(4,dpx);cur$.hidden=false;
  cur$.style.width=cur$.style.height=z+'px';cur$.style.transform=`translate(${e.clientX-r.left-z/2}px,${e.clientY-r.top-z/2}px)`;
  cur$.style.background=GS.tool==='eraser'?'rgba(255,255,255,.5)':GS.color+(GS.tool==='hl'?'66':'aa')};
 live.onpointerenter=showCur;live.onpointerleave=()=>{cur$.hidden=true};
 live.onpointerdown=async e=>{
  if(e.button>0)return;e.preventDefault();const p=at(e);
  if(GS.tool==='fill'){if(busy)return;busy=true;try{const s=await floodFill(picId,d.strokes,p[0],p[1],GS.color);if(s){d.strokes.push(s);d.undo.push({t:'draw',i:d.strokes.length-1});redraw();gsave()}}finally{busy=false}return}
  live.setPointerCapture(e.pointerId);
  if(GS.tool==='eraser'){erased=[];eraseAt(p);return}
  cur={tool:GS.tool,color:GS.color,size:GS.size,pts:[p]};
  ctx.clearRect(0,0,gDim.W,gDim.H);drawStroke(ctx,cur,gDim.W,gDim.H);
 };
 live.onpointermove=e=>{
  showCur(e);
  if(!cur&&!erased)return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  evs.forEach(ev=>{const p=at(ev);if(erased)return eraseAt(p);const l=cur.pts[cur.pts.length-1];if(Math.hypot((p[0]-l[0])*gDim.W,(p[1]-l[1])*gDim.H)>=1.2)cur.pts.push(p)});
  if(cur){ctx.clearRect(0,0,gDim.W,gDim.H);drawStroke(ctx,cur,gDim.W,gDim.H)}
 };
 const end=()=>{
  if(erased){if(erased.length)d.undo.push({t:'erase',is:erased});erased=null;gsave();refreshTabs();return}
  if(!cur)return;d.strokes.push(cur);d.undo.push({t:'draw',i:d.strokes.length-1});cur=null;
  ctx.clearRect(0,0,gDim.W,gDim.H);redraw();gsave();refreshTabs();
 };
 live.onpointerup=end;live.onpointercancel=end;
}
function refreshTabs(){const t=$g('.gtab.on');if(!t)return;const d=pdata(GS.list[GS.cur]),used=d.strokes.some(s=>s.del==null),i=t.querySelector('i');if(used&&!i)t.insertAdjacentHTML('beforeend','<i aria-label="есть пометки"></i>');if(!used&&i)i.remove()}
window.addEventListener('resize',()=>fitStage());

/* ---- pictures: result cards ---- */
function compose(id,strokes,T,scale=1){
 const p=PIC[id];return loadImg(p.src).then(img=>{const W=Math.round(p.w*scale),H=Math.round(p.h*scale);const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(img,0,0,W,H);
  const o=document.createElement('canvas');o.width=W;o.height=H;drawAll(o.getContext('2d'),strokes,W,H,T);x.globalCompositeOperation='multiply';x.drawImage(o,0,0);return c})
}
function gilBlock(rec){
 const g0=rec.gil;if(!g0||!g0.list||!g0.list.length)return{html:'<p class="muted">Картинки не проводились.</p>',text:'',bind(){}};
 const seen=g0.list.filter(id=>{const d=g0.data[id];return d&&(d.strokes.length||d.note||d.ms>1500)});
 const g={...g0,list:seen.length?seen:g0.list};
 const html=`<div class="gres">${g.list.map(id=>{const d=g.data[id]||{strokes:[]},alive=d.strokes.filter(s=>s.del==null).length,er=d.strokes.length-alive;return`
  <section class="sheet gcard" data-id="${id}">
   <div class="row" style="justify-content:space-between"><h3>${esc(PIC[id].title)}</h3><span class="note">${d.strokes.length} пометок${er?` · стёрто ${er}`:''} · ${fmtMs(d.ms||0)}</span></div>
   <div class="gshot"><canvas aria-label="Картинка с пометками ребёнка"></canvas></div>
   <div class="row"><button data-play>▶ Воспроизвести</button><button data-png>Скачать PNG</button></div>
   ${d.note?`<p class="gnote">${esc(d.note)}</p>`:'<p class="note">Протокол не заполнен.</p>'}
  </section>`}).join('')}</div>`;
 let t='КАРТИНКИ (по типу Р. Жиля)\n';
 g.list.forEach(id=>{const d=g.data[id]||{strokes:[]};t+=`\n${PIC[id].title} — пометок ${d.strokes.length}, стёрто ${d.strokes.filter(s=>s.del!=null).length}, время ${fmtMs(d.ms||0)}\n${d.note||'(протокол не заполнен)'}\n`});
 const bind=root=>root.querySelectorAll('.gcard').forEach(card=>{
  const id=card.dataset.id,d=g.data[id]||{strokes:[]},cv=card.querySelector('canvas');
  const paint=T=>compose(id,d.strokes,T,.8).then(c=>{cv.width=c.width;cv.height=c.height;cv.getContext('2d').drawImage(c,0,0)});
  paint();
  let anim=0;
  card.querySelector('[data-play]').onclick=e=>{
   const btn=e.currentTarget;if(anim){cancelAnimationFrame(anim);anim=0;btn.textContent='▶ Воспроизвести';return paint()}
   const ev=[];d.strokes.forEach(s=>{s.pts.forEach(p=>ev.push(p[2]));if(s.del!=null)ev.push(s.del)});ev.sort((a,b)=>a-b);if(!ev.length)return;
   const V=[0];for(let i=1;i<ev.length;i++)V.push(V[i-1]+Math.min(ev[i]-ev[i-1],500));
   const toT=v=>{let lo=0,hi=V.length-1;if(v>=V[hi])return ev[hi];while(hi-lo>1){const m=(lo+hi)>>1;if(V[m]<=v)lo=m;else hi=m}const f=V[hi]>V[lo]?(v-V[lo])/(V[hi]-V[lo]):0;return ev[lo]+f*(ev[hi]-ev[lo])};
   btn.textContent='■ Стоп';let start=null,busy=false;
   const step=ts=>{if(start==null)start=ts;const v=(ts-start)*1.5;const T=toT(v);
    if(!busy){busy=true;paint(T).then(()=>busy=false)}
    if(v<V[V.length-1]+300)anim=requestAnimationFrame(step);else{anim=0;btn.textContent='▶ Воспроизвести';paint()}};
   anim=requestAnimationFrame(step);
  };
  card.querySelector('[data-png]').onclick=async()=>{
   const fname=`${(rec.name||'работа').replace(/[\\/:*?"<>|]/g,'')} — ${PIC[id].title} — ${rec.date}.png`;
   const c=await compose(id,d.strokes,null,1);c.toBlob(b=>{const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);flash('Файл сохранён в «Загрузки».')},'image/png');
  };
 });

 const el=f.el;let st=null;
 el.addEventListener('pointerdown',e=>{if(e.button>0)return;e.preventDefault();el.setPointerCapture(e.pointerId);st={x:e.clientX,y:e.clientY,left:parseFloat(el.style.left),top:parseFloat(el.style.top),moved:false,target:null}});
 el.addEventListener('pointermove',e=>{if(!st)return;const dx=e.clientX-st.x,dy=e.clientY-st.y;if(!st.moved&&Math.hypot(dx,dy)<6)return;
  if(!st.moved){st.moved=true;el.classList.add('dragging');EMB.sel=null;el.classList.remove('selected')}
  el.style.left=(st.left+dx)+'px';el.style.top=(st.top+dy)+'px';st.target=findTarget(f.key,e.clientX,e.clientY);showGhost(st.target)});
 const end=e=>{if(!st)return;const s=st;st=null;el.classList.remove('dragging');showGhost(null);
  if(!s.moved){onFigClick(f.key);return}
  if(s.target)joinFigures(f.key,s.target.key,s.target.putLeft);
  else if(pairIndexOf(f.key)>=0){const fr=EMB.pairs[pairIndexOf(f.key)].frame.getBoundingClientRect();if(e.clientX<fr.left||e.clientX>fr.right||e.clientY<fr.top||e.clientY>fr.bottom){breakPair(pairIndexOf(f.key));EMB.unpairs++}}
  layoutPairs()};
 el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
function finishEmo(){
 if(!EMB||EMB.pairs.length<PAIRS_DATA.length)return;
 const rt=Date.now()-EMB.start;let score=0,nPartner=0;const rows=[];
 PAIRS_DATA.forEach(pd=>{const mk='m'+pd.id,p=EMB.pairs[pairIndexOf(mk)],dk=partnerOf(mk),dId=EMB.figs[dk].id,side=p.left===mk?'left':'right';
  const pOk=dId===pd.id?1:0,sOk=side===pd.momSide?1:0,c=pOk&&sOk?1:0;score+=c;nPartner+=pOk;
  rows.push({mom:pd.id,daughter:dId,side,expected:pd.momSide,partner:pOk,sideOk:pOk?sOk:null,correct:c})});
 SK.emo={done:true,score,nPartner,max:PAIRS_DATA.length,rt,moves:EMB.moves,unpairs:EMB.unpairs,swaps:EMB.swaps,rows};
 EMB=null;SK.emoPhase='intro';sksave();upsertSession();goHome();
}

/* ---------- result blocks ---------- */
function emoBlock(e){
 if(!e)return{html:'<p class="muted">Не проводилась.</p>',text:''};
 const sideRu=s=>s==='left'?'слева':'справа';
 const html=`<section class="sheet">
  <div class="cards"><div class="card"><span class="eyebrow">Верных пар с учётом расположения</span><b>${e.score} из ${e.max}</b></div><div class="card"><span class="eyebrow">Без учёта расположения</span><b>${e.nPartner} из ${e.max}</b></div><div class="card"><span class="eyebrow">Время</span><b>${fmtS(e.rt)}</b><span class="muted">соединений ${e.moves} · разъединений ${e.unpairs} · перестановок ${e.swaps}</span></div></div>
  <div class="tblw"><table><thead><tr><th>Мама</th><th>Выбранная дочка</th><th>Мама стоит</th><th>Нужно</th><th>Пара</th></tr></thead><tbody>
  ${e.rows.map(r=>`<tr><td><img class="tfig" src="skr/emotions/mom${r.mom}.webp" alt="мама ${r.mom}"></td><td><img class="tfig" src="skr/emotions/daughter${r.daughter}.webp" alt="дочка ${r.daughter}"></td><td>${sideRu(r.side)}</td><td>${sideRu(r.expected)}</td><td>${r.correct?'<span class="status ok">верно</span>':r.partner?'<span class="status mid">не та сторона</span>':'<span class="status">не та дочка</span>'}</td></tr>`).join('')}
  </tbody></table></div></section>`;
 const text=`ЭМОЦИОНАЛЬНАЯ КОМПЕТЕНТНОСТЬ (мамы и дочки)\nВерных пар с учётом расположения: ${e.score} из ${e.max}; без учёта: ${e.nPartner}. Время ${fmtS(e.rt)}; соединений ${e.moves}, разъединений ${e.unpairs}, перестановок ${e.swaps}.\n`;
 return{html,text};
}
function socBlock(s){
 if(!s)return{html:'<p class="muted">Не проводилась.</p>',text:''};
 const avg=s.rows.reduce((a,r)=>a+r.rt,0)/s.rows.length;
 const html=`<section class="sheet">
  <div class="cards"><div class="card"><span class="eyebrow">Верных ответов</span><b>${s.score} из ${s.max}</b></div><div class="card"><span class="eyebrow">Среднее время на историю</span><b>${fmtS(avg)}</b></div></div>
  <div class="tblw"><table><thead><tr><th>История</th><th>Выбранный кадр</th><th>Ответ</th><th>Время</th><th>Смен ответа</th></tr></thead><tbody>
  ${s.rows.map((r,i)=>`<tr><td>${i+1}</td><td><img class="tcard" src="${STORY_DATA.find(q=>q.id===r.story)?.answers[r.answer_file-1]?.f||''}" alt="выбранный кадр"></td><td>${r.correct?'<span class="status ok">верно</span>':'<span class="status">неверно</span>'}</td><td class="num">${fmtS(r.rt)}</td><td class="num">${r.changes}</td></tr>`).join('')}
  </tbody></table></div></section>`;
 const text=`СОЦИАЛЬНАЯ КОМПЕТЕНТНОСТЬ (истории в картинках)\nВерных: ${s.score} из ${s.max}. Среднее время: ${fmtS(avg)}.\n`+s.rows.map((r,i)=>`История ${i+1}: ${r.correct?'верно':'неверно'}, ${fmtS(r.rt)}, смен ответа ${r.changes}`).join('\n')+'\n';
 return{html,text};
}

/* ================= sessions & archive ================= */
const SKEY='sessions-v1';
const archive=()=>{try{return JSON.parse(localStorage.getItem(SKEY))||[]}catch(e){return[]}};
const setArchive=a=>{try{localStorage.setItem(SKEY,JSON.stringify(a));return true}catch(e){flash('Архив переполнен или недоступен: '+e.message);return false}};
(function migrate(){try{const old=JSON.parse(localStorage.getItem('gil-archive-v1'));if(!old||!old.length)return;const a=archive();old.forEach(o=>a.push({id:o.id,name:o.name,age:o.age,date:o.date,updated:o.savedAt,dembo:null,gil:{list:o.list,data:o.data}}));if(setArchive(a))localStorage.removeItem('gil-archive-v1')}catch(e){}})();
const demboHas=()=>S.scales.some(s=>s.m.a!=null);
function currentRecord(){
 if(!S.sid)S.sid='r'+Date.now().toString(36);
 return{id:S.sid,name:S.name,age:S.age,date:S.date,updated:new Date().toISOString(),
  dembo:demboHas()?{done:!!S.done,scales:S.scales.map(s=>({name:s.name,top:s.top,bottom:s.bottom,role:s.role,note:s.note,m:s.m}))}:null,
  emo:SK.emo||null,soc:SK.soc||null,
  gil:gHas()?{done:!!GS.done,list:GS.list,data:Object.fromEntries(GS.list.map(id=>[id,{strokes:pdata(id).strokes,note:pdata(id).note,ms:pdata(id).ms}]))}:null};
}
function upsertSession(){
 const r=currentRecord();if(!r.dembo&&!r.gil&&!r.emo&&!r.soc)return;
 const a=archive(),i=a.findIndex(x=>x.id===r.id);if(i>=0)a[i]=r;else a.unshift(r);setArchive(a);save();
}

/* ================= home ================= */
let VIEW='home';try{VIEW=localStorage.getItem('view-v1')||'home'}catch(e){}
function goHome(){VIEW='home';render()}
function vHome(){
 const dDone=S.done&&demboHas(),dStarted=demboHas()&&!S.done,gDone=GS.done&&gHas(),gStarted=gHas()&&!GS.done;
 const nAns=S.scales.filter(s=>s.m.a!=null).length;
 const chip=(done,started,txt)=>done?`<span class="status ok">пройдено</span>`:started?`<span class="status mid">${txt}</span>`:`<span class="status">не начато</span>`;
 $('#app').innerHTML=`
 <header><div class="eyebrow">Диагностическая беседа</div><h1>Обследование</h1></header>
 <section class="sheet">
  <h2>Испытуемый</h2>
  <div class="grid3">
   <label class="f">Имя<input id="nm" type="text" value="${esc(S.name)}" autocomplete="off"></label>
   <label class="f">Возраст<input id="ag" type="number" min="3" max="99" value="${esc(S.age)}"></label>
   <label class="f">Дата<input id="dt" type="date" value="${esc(S.date)}"></label>
   <label class="f">Обращение в инструкциях<select id="ad"><option value="ty" ${S.addr==='ty'?'selected':''}>на «ты» (ребёнок, подросток)</option><option value="vy" ${S.addr==='vy'?'selected':''}>на «вы»</option></select></label>
  </div>
 </section>
 <div class="methods">
  <section class="sheet method">
   <div class="row" style="justify-content:space-between;align-items:start"><div><div class="eyebrow">Дембо — Рубинштейн</div><h2>Самооценка</h2></div>${chip(dDone,dStarted,`начато · ${nAns} из ${S.scales.length}`)}</div>
   <p class="muted">${S.scales.length} шкал${S.scales.length%10===1&&S.scales.length!==11?'а':S.scales.length%10>=2&&S.scales.length%10<=4&&(S.scales.length<10||S.scales.length>20)?'ы':''}: ${S.scales.map(s=>esc(s.name)).join(', ')}. Ребёнок видит одну шкалу и рисует на ней три отметки.</p>
   <div class="row">${dStarted?'<button class="primary" id="dcont">Продолжить</button><button id="dredo">Начать заново</button>':dDone?'<button id="dredo">Пройти заново</button>':'<button class="primary" id="dgo">Начать</button>'}<button class="ghost" id="dset">Настроить шкалы</button></div>
  </section>
  <section class="sheet method">
   <div class="row" style="justify-content:space-between;align-items:start"><div><div class="eyebrow">По типу методики Р. Жиля</div><h2>Картинки</h2></div>${chip(gDone,gStarted,'начато')}</div>
   <div class="mthumbs">${GS.order.filter(id=>GS.on[id]).map(id=>`<img src="${PIC[id].src}" alt="${esc(PIC[id].title)}" loading="lazy">`).join('')}</div>
   <div class="row">${gStarted?'<button class="primary" id="gcont">Продолжить</button><button id="gredo">Начать заново</button>':gDone?'<button id="gcont">Дорисовать</button><button id="gredo">Пройти заново</button>':'<button class="primary" id="ggo">Начать</button>'}<button class="ghost" id="gset">Выбрать картинки</button></div>
  </section>
  <section class="sheet method">
   <div class="row" style="justify-content:space-between;align-items:start"><div><div class="eyebrow">Скрининг 5–8 лет</div><h2>Эмоции: мамы и дочки</h2></div>${SK.emo?`<span class="status ok">пройдено · ${SK.emo.score} из ${SK.emo.max}</span>`:'<span class="status">не начато</span>'}</div>
   <div class="mthumbs tall">${[1,5].map(i=>`<img src="skr/emotions/mom${i}.webp" alt="">`).join('')}${[3,2].map(i=>`<img src="skr/emotions/daughter${i}.webp" alt="">`).join('')}</div>
   <p class="muted">Ребёнок перетаскивает маму к дочке, которая ей подходит по эмоции. Засчитывается верная пара и верная сторона.</p>
   <div class="row">${SK.emo?'<button id="eredo">Пройти заново</button>':'<button class="primary" id="ego0">Начать</button>'}</div>
  </section>
  <section class="sheet method">
   <div class="row" style="justify-content:space-between;align-items:start"><div><div class="eyebrow">Скрининг 5–8 лет</div><h2>Социальные ситуации</h2></div>${SK.soc?`<span class="status ok">пройдено · ${SK.soc.score} из ${SK.soc.max}</span>`:SK.so&&SK.socPhase==='trial'?`<span class="status mid">начато · ${SK.so.cur+1} из ${STORY_DATA.length}</span>`:'<span class="status">не начато</span>'}</div>
   <div class="mthumbs">${['stim1','stim2','stim3'].map(f=>`<img src="skr/story1/${f}.jpg" alt="">`).join('')}<span class="qthumb">?</span><img src="skr/story1/stim5.jpg" alt=""></div>
   <p class="muted">Истории в картинках: ребёнок перетаскивает в пустую клетку тот кадр, которого не хватает. ${STORY_DATA.length} историй.</p>
   <div class="row">${SK.so&&SK.socPhase==='trial'?'<button class="primary" id="scont">Продолжить</button><button id="sredo">Начать заново</button>':SK.soc?'<button id="sredo">Пройти заново</button>':'<button class="primary" id="sgo0">Начать</button>'}</div>
  </section>
 </div>
 <div class="row" style="justify-content:space-between">
  <button id="res" class="primary">Результаты${archive().length?` · архив ${archive().length}`:''}</button>
  <button id="newsub">Новый испытуемый</button>
 </div>
 <p class="gmsg note"></p>`;
 const b=(id,f)=>$(id).addEventListener('input',e=>{f(e.target.value);save()});
 b('#nm',v=>S.name=v);b('#ag',v=>S.age=v);b('#dt',v=>S.date=v);$('#ad').onchange=e=>{S.addr=e.target.value;save()};
 const sure=(btn,fn,txt='Точно? Отметки пропадут')=>btn.onclick=()=>{if(!btn.dataset.sure){btn.dataset.sure=1;btn.dataset.t=btn.textContent;btn.textContent=txt;setTimeout(()=>{if(btn.isConnected){delete btn.dataset.sure;btn.textContent=btn.dataset.t}},3000);return}fn()};
 const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
 on('#dgo',startDembo);on('#dcont',()=>{VIEW='dembo';S.phase=S.idx>=S.scales.length?'run':'run';if(S.idx>=S.scales.length){S.idx=S.scales.length-1}render()});
 if($('#dredo'))sure($('#dredo'),()=>{upsertSession();startDembo()});
 on('#dset',()=>{VIEW='dembo';S.phase='setup';render()});
 on('#ggo',startGil);on('#gcont',()=>{VIEW='gil';GS.phase='board';render()});
 if($('#gredo'))sure($('#gredo'),()=>{upsertSession();startGil()});
 on('#gset',()=>{VIEW='gil';GS.phase='setup';render()});
 on('#ego0',startEmo);if($('#eredo'))sure($('#eredo'),()=>{upsertSession();startEmo()},'Точно? Результат заменится');
 on('#sgo0',startSoc);on('#scont',()=>{VIEW='soc';render()});if($('#sredo'))sure($('#sredo'),()=>{upsertSession();startSoc()},'Точно? Результат заменится');
 on('#res',()=>{upsertSession();resSel=null;VIEW='results';render()});
 sure($('#newsub'),()=>{upsertSession();const keepS={scales:S.scales.map(s=>({name:s.name,top:s.top,bottom:s.bottom,role:s.role})),others:S.others,addr:S.addr};S=fresh();S.scales=keepS.scales.map(mkScale);S.others=keepS.others;S.addr=keepS.addr;
  const keepG={order:GS.order,on:GS.on,tool:GS.tool,color:GS.color,size:GS.size};GS=Object.assign(gfresh(),keepG);SK=skFresh();render();flash('Прошлое обследование сохранено в архиве.')},'Сохранить текущего в архив и начать нового?');
}

/* ================= results ================= */
let resSel=null;
function vResults(){
 const a=archive();
 if(resSel==null)resSel=(a.find(r=>r.id===S.sid)||a[0]||{}).id||null;
 const rec=a.find(r=>r.id===resSel);
 const D=rec&&rec.dembo?demboBlock(rec.dembo.scales):{html:'<p class="muted">Самооценка не проводилась.</p>',text:''};
 const Gb=rec?gilBlock(rec):{html:'',text:'',bind(){}};
 const Eb=emoBlock(rec&&rec.emo),Sb=socBlock(rec&&rec.soc);
 $('#app').innerHTML=`
 <header class="row" style="justify-content:space-between;align-items:end"><div><div class="eyebrow">Результаты</div><h1>${rec?esc(rec.name||'Без имени')+(rec.age?', '+esc(rec.age):''):'Пока пусто'}</h1></div><button id="home">← На главную</button></header>
 ${a.length?`<section class="sheet" style="gap:10px">
  <label class="f">Обследование<select id="rsel">${a.map(r=>`<option value="${r.id}" ${r.id===resSel?'selected':''}>${esc(r.name||'Без имени')}${r.age?', '+esc(r.age):''} · ${esc(r.date)}${r.id===S.sid?' (текущее)':''} — ${[r.dembo?'самооценка':'',r.gil?'картинки':'',r.emo?'эмоции':'',r.soc?'соц. ситуации':''].filter(Boolean).join(' + ')}</option>`).join('')}</select></label>
  <div class="row"><button id="rcopy" class="primary">Скопировать протокол</button><button id="rjson">Скопировать данные (JSON)</button>${rec&&rec.id!==S.sid?'<button class="ghost" id="rdel">Удалить из архива</button>':''}</div>
  <textarea id="out" readonly hidden style="min-height:140px;font:12px var(--f-mono)"></textarea><p class="gmsg note"></p>
 </section>
 <h2>Самооценка</h2>${D.html}
 <h2>Картинки</h2>${Gb.html}
 <h2>Эмоции: мамы и дочки</h2>${Eb.html}
 <h2>Социальные ситуации</h2>${Sb.html}`:'<p class="muted">Здесь появятся результаты, когда ребёнок пройдёт хотя бы одну методику. Всё хранится в этом браузере.</p>'}`;
 $('#home').onclick=goHome;
 if(!a.length)return;
 Gb.bind($('#app'));
 $('#rsel').onchange=e=>{resSel=e.target.value;render()};
 const cp=text=>{const o=$('#out');o.value=text;o.hidden=false;try{navigator.clipboard.writeText(text).then(()=>flash('Скопировано.'),()=>{o.select();flash('Текст выделен — скопируйте его вручную.')})}catch(e){o.select()}};
 $('#rcopy').onclick=()=>cp(`${rec.name||'Испытуемый'}${rec.age?', '+rec.age:''} · ${rec.date}\n\n${D.text||'Самооценка не проводилась.\n'}\n${Gb.text||'Картинки не проводились.\n'}\n${Eb.text}\n${Sb.text}`);
 $('#rjson').onclick=()=>cp(JSON.stringify({name:rec.name,age:rec.age,date:rec.date,dembo:rec.dembo&&rec.dembo.scales.map(s=>({name:s.name,top:s.top,bottom:s.bottom,role:s.role,...s.m,note:s.note})),emotions:rec.emo||null,social:rec.soc||null,pictures:rec.gil&&rec.gil.list.map(id=>({picture:PIC[id].title,note:rec.gil.data[id]?.note||'',ms:rec.gil.data[id]?.ms||0,marks:rec.gil.data[id]?.strokes.length||0}))},null,1));
 const del=$('#rdel');if(del)del.onclick=()=>{if(!del.dataset.sure){del.dataset.sure=1;del.textContent='Точно удалить?';return}setArchive(archive().filter(r=>r.id!==resSel));resSel=null;render()};
}

/* ================= router ================= */
function render(){
 save();gsave();sksave();try{localStorage.setItem('view-v1',VIEW)}catch(e){}
 if(VIEW!=='gil'&&gRO){gRO.disconnect();gRO=null}
 const board=(VIEW==='gil'&&GS.phase==='board')||(VIEW==='emo'&&SK.emoPhase==='board')||(VIEW==='soc'&&SK.socPhase==='trial');
 document.body.classList.toggle('board',board);
 document.getElementById('app').classList.toggle('boardwrap',board);
 if(VIEW==='dembo')(({setup:vSetup,intro:vIntro,run:vRun})[S.phase]||vSetup)();
 else if(VIEW==='gil')(({setup:gSetup,board:gBoard})[GS.phase]||gSetup)();
 else if(VIEW==='emo')vEmo();
 else if(VIEW==='soc')vSoc();
 else if(VIEW==='results')vResults();
 else vHome();
 const board2=(VIEW==='gil'&&GS.phase==='board')||(VIEW==='emo'&&SK.emoPhase==='board')||(VIEW==='soc'&&SK.socPhase==='trial');
 document.body.classList.toggle('board',board2);
 document.getElementById('app').classList.toggle('boardwrap',board2);
 window.scrollTo(0,0);
}
if(VIEW==='gil'&&GS.phase==='board'&&!GS.list.length)VIEW='home';
if(VIEW==='dembo'&&(S.phase==='result'))S.phase='setup';
if(VIEW==='emo')SK.emoPhase='intro';
render();

</script>
</body>
</html>
